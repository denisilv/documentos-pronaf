<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documentos Gerados</title>
    <style>
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #f4f7f4;
            padding: 40px 20px;
            color: #222;
        }
        .box {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            padding: 36px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            text-align: center;
        }
        h1 {
            color: #1a5f2a;
            margin-bottom: 8px;
        }
        .nome {
            color: #555;
            margin-bottom: 28px;
            font-size: 1.05rem;
        }
        .downloads {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 28px 0;
        }
        .btn {
            display: block;
            padding: 14px 20px;
            background: #2e7d32;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.2s;
        }
        .btn:hover { background: #1b5e20; }
        .btn-secondary {
            background: #555;
            margin-top: 20px;
        }
        .btn-secondary:hover { background: #333; }
        .ok {
            font-size: 3rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="ok">✓</div>
        <h1>Documentos gerados com sucesso!</h1>
        <p class="nome">Cliente: <strong>{{ nome }}</strong></p>

        <div class="downloads">
            <a class="btn" href="/download/{{ arquivos.atividade }}">📄 Declaração de Atividade</a>
            <a class="btn" href="/download/{{ arquivos.posse }}">📄 Declaração de Posse Mansa</a>
            <a class="btn" href="/download/{{ arquivos.vizinhanca }}">📄 Declaração de Vizinhança</a>
            <a class="btn" href="/download/{{ arquivos.ficha }}">📄 Ficha Cadastral PRONAF</a>
        </div>

        <a class="btn btn-secondary" href="/">← Gerar novos documentos</a>
    </div>
</body>
</html>
